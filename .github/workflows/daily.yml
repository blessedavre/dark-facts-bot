name: daily-videos
on:
schedule:
- cron: "0 10 * * *"
- cron: "0 17 * * *"
workflow_dispatch: {}

permissions:
contents: write

concurrency:
group: video-gen
cancel-in-progress: false

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 30
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- name: Install
run: |
sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
pip install requests edge-tts
- name: Generate video
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
TG_TOKEN: ${{ secrets.TG_TOKEN }}
TG_CHAT: ${{ secrets.TG_CHAT }}
run: python make_video.py
- name: Keep the video (7 days)
uses: actions/upload-artifact@v4
with:
name: video-${{ github.run_id }}
path: |
out/final.mp4
out/caption.txt
retention-days: 7
- name: Save used topics
run: |
git config user.name "bot"
git config user.email "bot@users.noreply.github.com"
git add used_topics.txt
git commit -m "topic log" || true
git push
